name: Image

# baut das Image, getaggt mit dem Commit-SHA, und schreibt den Tag ins infra-Repo (values/rezepte.yaml).
# Argo CD sieht diesen Commit und deployt genau diesen Build, der Cluster wird von hier nie angefasst (GitOps)
on:
    push:
        branches: main
        paths-ignore:
            - "README.md"
            - "docker-compose.yml"
            - ".env.example"
    workflow_dispatch:

permissions:
    contents: read
    packages: write

# deployt in der Reihenfolge der Commits, ein neuerer Lauf überholt nie einen älteren
concurrency:
    group: image
    cancel-in-progress: false

jobs:
    image:
        name: Build and push
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npx tsc --noEmit
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=sha,format=long,prefix=
                      type=raw,value=latest
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        name: Update image tag in infra
        needs: image
        runs-on: ubuntu-latest
        steps:
            # Deploy-Key von Dannyyy101/infra mit Schreibrecht, hier als Secret INFRA_DEPLOY_KEY
            - uses: actions/checkout@v6
              with:
                  repository: Dannyyy101/infra
                  ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
                  path: infra
            - name: Write the tag
              working-directory: infra
              env:
                  SHA: ${{ github.sha }}
              run: |
                  yq -i ".image.tag = \"${SHA}\"" values/rezepte.yaml
                  git diff
            - name: Commit and push
              working-directory: infra
              env:
                  SHA: ${{ github.sha }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add values/rezepte.yaml
                  git diff --cached --quiet && exit 0
                  git commit -m "deploy(rezepte): ${SHA::7}" \
                      -m "https://github.com/${{ github.repository }}/commit/${SHA}"
                  # jemand anderes kann zwischendurch nach infra gepusht haben
                  for attempt in 1 2 3; do
                      git pull --rebase && git push && exit 0
                      sleep 5
                  done
                  exit 1
