# Nur für die lokale Entwicklung (npm run dev). In Produktion läuft die App im Cluster,
# deployt über das infra-Repo (helm/rezepte, values/rezepte.yaml).
services:
  db:
    image: postgres:17-alpine
    container_name: rezepte-db-dev
    environment:
      POSTGRES_USER: rezepte
      POSTGRES_PASSWORD: rezepte
      POSTGRES_DB: rezepte
    ports:
      - "5434:5432"
    volumes:
      - rezepte-daten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rezepte -d rezepte"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rezepte-daten:
